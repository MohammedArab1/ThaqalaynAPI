  #   volumes:
  #   - /root/.docker/config.json:/config.json
  #   - /var/run/docker.sock:/var/run/docker.sock
  #   command: --interval 30
  redis:
    container_name: redis
    image: redis/redis-stack-server
    restart: always
    ports:
      # Loopback only: local dev connects here; the API container uses
      # redis:6379 over apinetwork.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      - apinetwork
    # labels:
    # - "com.centurylinklabs.watchtower.enable=false"

networks:
  apinetwork:
