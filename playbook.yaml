- name: Deploy to Hetzner VPS
  hosts: hetzner-vps
  become: true

  tasks:
    - name: Pull latest changes from Git
      ansible.builtin.git:
        repo: 'https://github.com/MohammedArab1/ThaqalaynAPI.git'
        dest: /root/ThaqalaynAPI
        update: yes

    - name: Bring down Docker Compose application and remove images
      community.docker.docker_compose_v2:
        project_src: /root/ThaqalaynAPI
        state: absent
        remove_images: local

    - name: Bring up Docker Compose application
      community.docker.docker_compose_v2:
        project_src: /root/ThaqalaynAPI
        state: present
        build: always

    # `build: always` reuses the layer cache, but old layers stay in the
    # build cache until they are pruned. Drop cache older than one week so
    # the last deploy stays fast and the disk stays bounded.
    - name: Drop stale Docker build cache
      ansible.builtin.command:
        argv:
          - docker
          - builder
          - prune
          - --force
          - --filter
          - until=168h
      changed_when: false
