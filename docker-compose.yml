services:
  api:
    container_name: thaqalayn-api
    # image: lovemonge3r3/thaqalayn-api:latest
    build: .
    restart: always
    # Leave room for the 10s SHUTDOWN_TIMEOUT_MS default. Docker's default
    # stop grace period is also 10s, so a forced shutdown would race SIGKILL.
    stop_grace_period: 15s
    ports:
      # Bind to loopback: the API must only be reachable through Caddy.
      # The rate limiter trusts exactly one proxy hop, so exposing 3001
      # directly would let clients spoof X-Forwarded-For.
      - "127.0.0.1:3001:3001"
    healthcheck:
      # /ready checks PostgreSQL; the 5s timeout is longer than the 4s query
      # budget inside the endpoint.
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - apinetwork
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT}
      REDIS_URL: ${REDIS_URL}
      PLAUSIBLE_API_URL: ${PLAUSIBLE_API_URL}
      PLAUSIBLE_DOMAIN: ${PLAUSIBLE_DOMAIN}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_LIMIT: ${RATE_LIMIT_LIMIT:-30}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
    depends_on:
      redis:
        condition: service_healthy
